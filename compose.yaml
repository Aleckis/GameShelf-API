services:
 postgres:
  image: postgres:16
  environment:
   POSTGRES_USER: gameshelf
   POSTGRES_PASSWORD: gameshelf
   POSTGRES_DB: gameshelf
  ports: ["5432:5432"]
  volumes: ["pgdata:/var/lib/postgresql/data"]
 redis:
  image: redis:7
  ports: ["6379:6379"]
 postgres-test:
  image: postgres:16
  environment:
   POSTGRES_USER: gameshelf
   POSTGRES_PASSWORD: gameshelf
   POSTGRES_DB: gameshelf_test
  ports: ["127.0.0.1:5433:5432"]
  
volumes:
 pgdata: